[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapperbf"
version = "0.2.0"
description = "Extraction et contrôle qualité des annonces de marchés publics du Burkina Faso"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0", "urllib3>=2.0"]

[project.optional-dependencies]
ocr = ["pymupdf>=1.24", "pytesseract>=0.3.10", "pillow>=10.0"]
dev = ["pytest>=8.0"]

[project.scripts]
scrapperbf = "scrapperbf.cli:main"

[tool.setuptools]
packages = [
  "scrapperbf",
  "scrapperbf.core",
  "scrapperbf.qa",
  "scrapperbf.ocr",
  "scrapperbf.feedback",
  "scrapperbf.dashboard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

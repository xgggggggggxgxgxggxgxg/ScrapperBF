<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEILLE BF - Marchés publics du Burkina Faso</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-brand">
      <img class="auth-logo" src="assets/logo.svg" alt="">
      <h1>VEILLE BF</h1>
      <p class="tagline">Marchés publics du Burkina Faso</p>
    </div>
    <h2>Mot de passe oublié</h2>
    <p class="muted auth-intro" style="margin-bottom:20px">Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
    <form class="form" data-demo="">
      <div class="field"><label for="email">Adresse email</label><input id="email" name="email" type="email" required placeholder="votre@email.bf"></div>
      <button class="button full" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> Envoyer le lien</button>
    </form>
    <div class="auth-switch"><a class="link" href="login.html">Retour à la connexion</a></div>
    <div class="auth-footer">© 2026 Veille BF - Tous droits réservés</div>
  </section>
</main>
<script src="assets/auth.js"></script>
</body>
</html>

<style>
  /* Identité : bulletin officiel (DGCMEF) modernisé en outil de veille.
     Papier vert-gris · vert institutionnel · sceau ocre (accent unique).
     Spectral (titres) + Public Sans (données) + IBM Plex Mono (numéros). */
  :root{
    --paper:#eef0ea; --surface:#ffffff; --surface-2:#e7eae1; --sunk:#f4f6f0;
    --ink:#17211b; --muted:#54605a; --faint:#8a938c; --line:#d6dbce;
    --primary:#1d6b47; --primary-weak:#dfece4; --seal:#8f5e12; --seal-weak:#f0e6d2;
    --ok:#1d6b47; --warn:#8f5e12; --warn-weak:#f2e8d4; --crit:#a32f27; --crit-weak:#f3e1de;
    --info:#275a8a; --info-weak:#e2ebf4; --neutral:#6a736c; --neutral-weak:#e8eae2;
    --mini:#6b3fa0; --mini-weak:#ece3f6; --regi:#176a60; --regi-weak:#dbeeea;
    --shadow:0 1px 0 rgba(20,30,22,.03), 0 12px 32px -22px rgba(20,30,22,.35);
    --serif:"Spectral", Georgia, "Times New Roman", serif;
    --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#10140e; --surface:#161b14; --surface-2:#1e251c; --sunk:#12170f;
    --ink:#e9ede3; --muted:#9ba498; --faint:#6d766b; --line:#2c332a;
    --primary:#53b082; --primary-weak:#17281f; --seal:#cf9a4a; --seal-weak:#2b2311;
    --ok:#53b082; --warn:#cf9a4a; --warn-weak:#2b2311; --crit:#e27c71; --crit-weak:#331e1b;
    --info:#74a8df; --info-weak:#16263a; --neutral:#99a295; --neutral-weak:#232a20;
    --mini:#b78fe8; --mini-weak:#241a33; --regi:#5cc4b7; --regi-weak:#113029;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 36px -22px rgba(0,0,0,.65);
    color-scheme:dark; } }
  :root[data-theme="dark"]{
    --paper:#10140e; --surface:#161b14; --surface-2:#1e251c; --sunk:#12170f;
    --ink:#e9ede3; --muted:#9ba498; --faint:#6d766b; --line:#2c332a;
    --primary:#53b082; --primary-weak:#17281f; --seal:#cf9a4a; --seal-weak:#2b2311;
    --ok:#53b082; --warn:#cf9a4a; --warn-weak:#2b2311; --crit:#e27c71; --crit-weak:#331e1b;
    --info:#74a8df; --info-weak:#16263a; --neutral:#99a295; --neutral-weak:#232a20;
    --mini:#b78fe8; --mini-weak:#241a33; --regi:#5cc4b7; --regi-weak:#113029;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 36px -22px rgba(0,0,0,.65);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55; }
  h1,h2,h3{ font-family:var(--serif); font-weight:600; margin:0; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  button{ font:inherit; color:inherit; }
  a{ color:var(--primary); }

  select,input[type=search]{ font-family:var(--sans); font-size:.82rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:8px 10px; }
  .btn{ font-size:.8rem; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); padding:7px 13px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:border-color .15s,color .15s; }
  .btn:hover{ border-color:var(--primary); color:var(--primary); }
  .btn.ghost{ background:transparent; }
  .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  /* ---- Masthead (bandeau-titre de gazette) ---- */
  .masthead{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); border-bottom:1px solid var(--line);
    padding-left:max(18px,env(safe-area-inset-left,0px)); padding-right:max(18px,env(safe-area-inset-right,0px)); }
  .mh-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-block:14px; }
  .wordmark{ margin-right:auto; min-width:0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .wordmark .mark{ font-family:var(--serif); font-weight:700; font-size:1.52rem; letter-spacing:-.015em; line-height:1; color:var(--ink); }
  .wordmark .tag{ font-size:.78rem; color:var(--muted); }
  .numero{ font-family:var(--mono); font-size:.7rem; font-weight:600; color:var(--seal); background:var(--seal-weak); border:1px solid var(--seal); border-radius:2px; padding:3px 8px; white-space:nowrap; }
  .tabs{ display:flex; gap:4px; }
  .tab{ background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); padding:9px 2px; margin-right:18px; font-weight:600; font-size:.92rem; cursor:pointer; }
  .tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--primary); }
  .tab:hover{ color:var(--ink); }

  .wrap{ padding-left:max(18px,env(safe-area-inset-left,0px)); padding-right:max(18px,env(safe-area-inset-right,0px)); padding-bottom:40px; max-width:1240px; margin:0 auto; }

  /* ---- Stat row ---- */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; padding-block:18px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  .stat .k{ font-size:.74rem; color:var(--muted); }
  .stat .v{ font-family:var(--serif); font-size:1.7rem; font-weight:600; margin-top:3px; letter-spacing:-.01em; }
  .stat .v small{ font-size:.85rem; color:var(--faint); font-weight:500; }

  .layout{ display:grid; grid-template-columns:390px 1fr; gap:18px; align-items:start; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
  aside{ position:sticky; top:118px; }
  .filters{ padding:14px; display:flex; flex-direction:column; gap:11px; border-bottom:1px solid var(--line); }
  .filters .row{ display:flex; gap:8px; } .filters .row>*{ flex:1; min-width:0; }
  .chk{ display:flex; align-items:center; gap:7px; font-size:.8rem; color:var(--muted); cursor:pointer; }
  .list{ max-height:64vh; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
  .item{ text-align:left; width:100%; cursor:pointer; border:1px solid transparent; border-left:3px solid transparent; background:transparent; border-radius:8px; padding:11px 12px; display:grid; gap:5px; color:inherit; }
  .item:hover{ background:var(--sunk); }
  .item.active{ background:var(--sunk); border-color:var(--line); border-left-color:var(--primary); }
  .item .top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .item .title{ font-weight:600; font-size:.88rem; line-height:1.32; min-width:0; }
  .item .foot{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:.72rem; color:var(--faint); }
  .src-chip{ color:var(--primary); font-weight:600; }

  .pill{ font-size:.68rem; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .p-ok{ background:var(--primary-weak); color:var(--ok); } .p-warn{ background:var(--warn-weak); color:var(--warn); } .p-crit{ background:var(--crit-weak); color:var(--crit); }
  .sec-mini{ background:var(--mini-weak); color:var(--mini); } .sec-regi{ background:var(--regi-weak); color:var(--regi); }
  .flag{ font-size:.7rem; padding:1px 7px; border-radius:5px; background:var(--crit-weak); color:var(--crit); font-weight:600; }

  /* ---- Fiche détail ---- */
  .detail{ padding:24px; min-width:0; }
  .detail h2{ font-size:1.42rem; line-height:1.22; letter-spacing:-.01em; text-wrap:balance; max-width:62ch; }
  .detail .emetteur{ color:var(--muted); font-size:.92rem; margin-top:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip{ font-size:.72rem; padding:3px 9px; border-radius:6px; background:var(--sunk); color:var(--muted); border:1px solid var(--line); }
  .chip.strong{ background:var(--primary-weak); color:var(--primary); border-color:transparent; font-weight:600; }
  .gauge{ text-align:center; flex-shrink:0; }
  .gauge .num{ font-family:var(--serif); font-size:2.2rem; font-weight:600; line-height:1; letter-spacing:-.01em; }
  .gauge .lbl{ font-size:.68rem; color:var(--muted); margin-top:4px; }
  .section-title{ font-family:var(--serif); font-size:1.04rem; font-weight:600; color:var(--ink); margin:26px 0 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .fields{ display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .field{ background:var(--surface); padding:11px 14px; display:grid; grid-template-columns:184px 1fr auto; gap:14px; align-items:start; min-width:0; }
  .field .k{ font-size:.78rem; color:var(--muted); font-weight:600; word-break:break-word; }
  .field .val{ font-size:.88rem; min-width:0; word-break:break-word; white-space:pre-wrap; }
  .field .val.empty{ color:var(--faint); font-style:italic; }
  .badge{ font-size:.68rem; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .b-confirme{ background:var(--primary-weak); color:var(--ok); } .b-complete{ background:var(--info-weak); color:var(--info); }
  .b-corrige{ background:var(--warn-weak); color:var(--warn); } .b-absent{ background:var(--neutral-weak); color:var(--neutral); } .b-verifier{ background:var(--crit-weak); color:var(--crit); }

  .jchecks{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .jcheck{ display:flex; justify-content:space-between; gap:8px; font-size:.78rem; padding:7px 10px; border-radius:7px; background:var(--surface); border:1px solid var(--line); min-width:0; }
  .jcheck .jname{ font-weight:600; white-space:nowrap; }
  .jcheck .jdetail{ color:var(--faint); text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .j-pass{ border-left:3px solid var(--ok); } .j-warn{ border-left:3px solid var(--warn); background:var(--warn-weak); }
  .j-fail{ border-left:3px solid var(--crit); background:var(--crit-weak); } .j-na{ opacity:.55; }

  .lot{ border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:11px; background:var(--sunk); }
  .lot h4{ font-family:var(--serif); font-size:.98rem; font-weight:600; margin:0 0 7px; }
  .rawbox{ white-space:pre-wrap; font-family:var(--mono); font-size:.76rem; line-height:1.55; color:var(--muted); background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:13px; max-height:430px; overflow:auto; }
  table.soum{ width:100%; border-collapse:collapse; font-size:.78rem; }
  table.soum th,table.soum td{ border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  table.soum th{ background:var(--surface-2); font-weight:600; }
  .scroll-x{ overflow-x:auto; }
  .reasons{ display:flex; flex-direction:column; gap:8px; }
  .reason{ border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; padding:11px 13px; background:var(--warn-weak); }
  .reason.crit{ border-left-color:var(--crit); background:var(--crit-weak); }
  .reason .rf{ font-family:var(--mono); font-weight:600; font-size:.78rem; }
  .perfect{ border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:8px; padding:13px 15px; color:var(--ok); background:var(--primary-weak); font-weight:600; }
  .empty-state{ padding:64px 20px; text-align:center; color:var(--muted); font-family:var(--serif); font-size:1.05rem; }
  .bar{ height:9px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .bar>span{ display:block; height:100%; background:var(--primary); }

  dialog{ border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); max-width:640px; width:92vw; box-shadow:var(--shadow); padding:0; }
  dialog::backdrop{ background:rgba(16,22,16,.5); }
  .dlg{ padding:20px; display:flex; flex-direction:column; gap:12px; }
  .dlg h3{ font-family:var(--serif); font-size:1.1rem; font-weight:600; }
  textarea{ width:100%; min-height:220px; font-family:var(--mono); font-size:.8rem; border:1px solid var(--line); border-radius:8px; padding:11px; background:var(--sunk); color:var(--ink); resize:vertical; }
  .dlg-act{ display:flex; justify-content:flex-end; gap:8px; }
  .err{ color:var(--crit); font-size:.8rem; min-height:1em; }

  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } aside{ position:static; } .list{ max-height:none; } .field{ grid-template-columns:1fr; gap:4px; } .jchecks{ grid-template-columns:1fr; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

  if(state.tab==="avis"){ const A=DATA.avis.filter(inBulletin);
    const jc=A.filter(a=>a._judge); const javg=jc.length?Math.round(100*jc.reduce((s,a)=>s+a._judge.confiance,0)/jc.length):"—";
    const rev=A.filter(a=>a._judge&&a._judge.revue_humaine).length;
    el.innerHTML=cells([["Avis",A.length],["Confiance juge",typeof javg==="number"?`${javg}<small>%</small>`:"—"],["Revue humaine",`${rev}<small>/${A.length}</small>`],["Bulletins",new Set(A.map(sourceOf)).size]]);
  } else if(state.tab==="resultats"){ const R=DATA.resultats.filter(inBulletin);
    const mini=R.filter(r=>r.macro_section!=="REGIONS").length, regi=R.length-mini;
    const lots=R.reduce((s,r)=>s+(r.nombre_lots||0),0);
    el.innerHTML=cells([["Émetteurs",R.length],["Ministères",mini],["Régions",regi],["Lots détectés",lots]]);
  } else { el.innerHTML=""; }
}
function cells(arr){ return arr.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join(""); }

function renderQualite() {
  const A=DATA.avis.filter(inBulletin);
  const bands=[["100 %",a=>a._score_exactitude===100,"p-ok"],["80–99 %",a=>a._score_exactitude>=80&&a._score_exactitude<100,"p-warn"],["< 80 %",a=>a._score_exactitude<80,"p-crit"]];
  const n=A.length||1;
  const jv={valide:0,a_verifier:0,rejete:0}; A.forEach(a=>{ if(a._judge&&jv[a._judge.verdict]!=null) jv[a._judge.verdict]++; });
  const review=A.filter(a=>a._judge&&a._judge.revue_humaine);
  const jverd=[["Validé (auto)",jv.valide,"ok"],["À vérifier",jv.a_verifier,"warn"],["Rejeté",jv.rejete,"crit"]].map(([l,k,c])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${l}</span><span class="mono">${k} (${Math.round(100*k/n)}%)</span></div><div class="bar"><span style="width:${Math.round(100*k/n)}%;background:var(--${c})"></span></div></div>`).join("");
  const reviewList=review.slice(0,15).map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding:5px 0;border-bottom:1px solid var(--border)"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sourceOf(a))} — ${esc((a.objet||a.autorite_emettrice||"").slice(0,55))}</span><span class="pill ${verdictCls(a._judge.verdict)}" style="flex-shrink:0">${judgePct(a._judge)}%</span></div>`).join("");
  const dist=bands.map(([lbl,f,c])=>{ const k=A.filter(f).length; return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${lbl}</span><span class="mono">${k} (${Math.round(100*k/n)}%)</span></div><div class="bar"><span style="width:${Math.round(100*k/n)}%;background:var(--${c==='p-ok'?'ok':c==='p-warn'?'warn':'crit'})"></span></div></div>`; }).join("");
  const routed=A.filter(a=>a._decision&&a._decision.needs_llm).length;
  const cov={}; ["montant_previsionnel_global","date_limite_depot","financement","numero_reference"].forEach(k=>{ cov[k]=Math.round(100*A.filter(a=>!isEmpty(a[k])).length/n); });
  const covHtml=Object.entries(cov).map(([k,v])=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${esc(AVIS_FIELDS[k]||k)}</span><span class="mono">${v}%</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`).join("");
  const faulty={}; A.forEach(a=>(a._raisons_ecart||[]).forEach(r=>{ faulty[r.champ]=(faulty[r.champ]||0)+1; }));
  const top=Object.entries(faulty).sort((x,y)=>y[1]-x[1]).slice(0,6);
  $("#qualite").innerHTML=`<h2>Qualité &amp; contrôle</h2>
    <div class="section-title">Verdict du juge (contrôle de cohérence)</div>${jverd}
    ${review.length?`<div class="section-title">File de revue humaine — ${review.length} avis</div>${reviewList}`:`<div class="perfect">✓ Aucun avis en attente de revue humaine</div>`}
    <div class="section-title">Complétude de la 1re passe (couverture)</div>${dist}
    <div class="section-title">Couverture des champs clés</div>${covHtml}
    <div class="section-title">Routage vers l'API</div><p style="font-size:.9rem">${routed} avis sur ${A.length} seraient renvoyés à l'API par le modèle de décision (les autres sont jugés propres).</p>
    ${top.length?`<div class="section-title">Champs les plus souvent en écart</div>`+top.map(([c,k])=>`<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:3px 0;border-bottom:1px solid var(--border)"><span class="mono">${esc(c)}</span><span>${k}×</span></div>`).join(""):""}`;
}

/* ---------- Tabs / filters / data ---------- */
function showTab(t) {
  state.tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  $("#tab-avis").hidden=t!=="avis"; $("#tab-resultats").hidden=t!=="resultats"; $("#tab-qualite").hidden=t!=="qualite";
  renderStats();
  if(t==="qualite") renderQualite();
}
function fillSelect(sel, values, allLabel){ sel.innerHTML=`<option value="">${allLabel}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(""); }

function loadData(obj, label) {
  // Accepte {AVIS,RESULTATS}, un tableau d'objets de ce type, ou {avis,resultats}
  let avis=[], res=[];
  const docs = Array.isArray(obj) ? obj : [obj];
  for(const dcc of docs){
    if(Array.isArray(dcc.AVIS)) avis=avis.concat(dcc.AVIS);
    if(Array.isArray(dcc.avis)) avis=avis.concat(dcc.avis);
    if(Array.isArray(dcc.RESULTATS)) res=res.concat(dcc.RESULTATS);
    if(Array.isArray(dcc.resultats)) res=res.concat(dcc.resultats);
  }
  avis.forEach((a,i)=>a._uid="a"+i); res.forEach((r,i)=>r._uid="r"+i);
  DATA.avis=avis; DATA.resultats=res; DATA.meta=(docs[0]&&docs[0].meta)||{source:label};
  state.avisSel=avis[0]?avis[0]._uid:null; state.resSel=res[0]?res[0]._uid:null; state.bulletin="";
  $("#srcTag").textContent=label;
  fillSelect($("#bulletinFilter"), bulletins(), `Tous les bulletins (${bulletins().length})`);
  fillSelect($("#avisCat"), Array.from(new Set(avis.map(a=>a.categorie).filter(Boolean))).sort(), "Toutes catégories");
  fillSelect($("#avisType"), Array.from(new Set(avis.map(a=>a.type_avis).filter(Boolean))).sort(), "Tous types");
  renderStats(); renderAvisList(); renderAvisDetail(); renderResList(); renderResDetail();
}

$("#bulletinFilter").onchange=(e)=>{ state.bulletin=e.target.value; renderStats(); renderAvisList(); renderAvisDetail(); renderResList(); renderResDetail(); if(state.tab==="qualite")renderQualite(); };
["#avisSearch","#avisCat","#avisType","#avisFlagged","#avisReview"].forEach(s=>$(s).addEventListener("input",renderAvisList));
["#resSearch","#resSection"].forEach(s=>$(s).addEventListener("input",renderResList));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

$("#fileInput").addEventListener("change",(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ loadData(JSON.parse(r.result), f.name); }catch(err){ $("#avisDetail").innerHTML=`<div class="empty-state" style="color:var(--crit)">JSON invalide.<br><span class="mono">${esc(err.message)}</span></div>`; } }; r.readAsText(f); });
$("#pasteBtn").onclick=()=>{ $("#pasteErr").textContent=""; $("#pasteDlg").showModal(); };
$("#pasteLoad").onclick=()=>{ try{ loadData(JSON.parse($("#pasteArea").value),"JSON collé"); $("#pasteDlg").close(); }catch(err){ $("#pasteErr").textContent="Erreur : "+err.message; } };

(function theme(){ let s=null; try{ s=localStorage.getItem("mpbf-theme"); }catch(e){} if(s)document.documentElement.setAttribute("data-theme",s);
  $("#themeBtn").onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme"); const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches; const nx=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); try{ localStorage.setItem("mpbf-theme",nx); }catch(e){} }; })();

loadData(DATA, "Bulletins DGCMEF — N°4500, 4503, 4505, 4509");
showTab("avis");
</script>
